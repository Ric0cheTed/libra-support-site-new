name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit all locked dependency classes
        run: npm audit --audit-level=low

      - name: Required TypeScript check
        run: npm run typecheck

      - name: Complete local contract regressions and native Sharp
        run: node --test scripts/v2-build1.test.cjs scripts/v2-build2.test.cjs scripts/v2-staff-publication.test.cjs scripts/v2-build3a.test.cjs

      - name: Font guardrail
        run: npm run check:font

      - name: Build
        run: npm run build

      - name: Exported staff privacy guard
        run: node scripts/v2-staff-publication.test.cjs --export

      - name: Generate candidate security headers without deploying
        run: node scripts/v2-build3a-security.cjs "$RUNNER_TEMP/libra-build3a-headers.json"
